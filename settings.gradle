pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
    }
}

rootProject.name = 'halo'

if (!file('core/settings.gradle').isFile()) {
    throw new GradleException('HaloCore is missing. Run: git submodule update --init --recursive')
}
includeBuild('core')
