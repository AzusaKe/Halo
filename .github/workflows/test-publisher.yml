name: Test release publisher

on:
  push:
    branches: [1.20.1-fabric, codex/release-automation]
    paths: ['scripts/release/**', '.github/release-targets.json', '.github/workflows/*publish*.yml']
  pull_request:
    branches: [1.20.1-fabric]
    paths: ['scripts/release/**', '.github/release-targets.json', '.github/workflows/*publish*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/release -p 'test_*.py' -v
