# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: ["26.2-neoforge", "caustica/26.2-neoforge"]
    tags: ["v*"]
  pull_request:
    branches: ["26.2-neoforge", "caustica/26.2-neoforge"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neoforge: ['26.2.0.59', '26.2.0.88']
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.1.7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 21 for the independent core wrapper
        uses: actions/setup-java@v4.2.1
        with:
          java-version: "21"
          distribution: "temurin"

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify core independently
        working-directory: core
        run: ./gradlew check

      - name: Set up JDK 25 for Minecraft 26.2
        uses: actions/setup-java@v4.2.1
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Fetch the inspected Caustica compile dependency
        env:
          CAUSTICA_JAR_URL: ${{ vars.CAUSTICA_JAR_URL }}
        run: |
          if [ -z "$CAUSTICA_JAR_URL" ]; then
            echo "::error::Set CAUSTICA_JAR_URL to the inspected 0cc9d0a JAR; public 0.1.x release jars do not match this API."
            exit 1
          fi
          curl --fail --location --retry 3 "$CAUSTICA_JAR_URL" -o "$RUNNER_TEMP/caustica-inspected.jar"
          EXPECTED=$(python3 -c 'import json; print(json.load(open("gradle/caustica-lock.json"))["jarSha256"])')
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/caustica-inspected.jar" | sha256sum --check
          echo "CAUSTICA_JAR=$RUNNER_TEMP/caustica-inspected.jar" >> "$GITHUB_ENV"

      - name: Build adapter and verify distribution
        env:
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew build -Pneo_version=${{ matrix.neoforge }} "-PcausticaJar=$CAUSTICA_JAR" -Prelease="$RELEASE_BUILD"

      # Upload JAR as workflow artifact (always available for download)
      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Halo-Mod-NeoForge-${{ matrix.neoforge }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the 26.2.0.59 distribution after verification passes
        uses: actions/download-artifact@v4
        with:
          name: Halo-Mod-NeoForge-26.2.0.59
          path: release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.1.7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4.2.1
        with:
          java-version: "25"
          distribution: "temurin"

      # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
      # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
        continue-on-error: true
