name: Publish Halo to mod platforms

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful tag build run ID (not a branch build)
        type: string
        required: true
      platform:
        description: Destination to publish or retry
        type: choice
        options: [both, modrinth, curseforge]
        default: both
      dry_run:
        description: Validate and preview only; do not upload anything
        type: boolean
        default: true
      notes_sha256:
        description: SHA-256 of the final edited Release body (required for real uploads)
        type: string
        default: ''
      options_json:
        description: 'Optional JSON: game_versions, java_versions, include_sources'
        type: string
        default: '{}'

# Receipts and intent records are GitHub Release assets. Never run source from
# the triggering tag with these permissions or with publishing credentials.
permissions:
  contents: write
  actions: read

concurrency:
  group: halo-platform-publish-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'AzusaKe/Halo' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/1.20.1-fabric'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted publishing implementation
        uses: actions/checkout@v4.1.7
        with:
          ref: 1.20.1-fabric
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release and publish selected destinations
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_PLATFORM: ${{ inputs.platform }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          FINAL_NOTES_SHA256: ${{ inputs.notes_sha256 }}
          RELEASE_OPTIONS_JSON: ${{ inputs.options_json }}
        run: |
          args=(--run-id "$SOURCE_RUN_ID" --platform "$PUBLISH_PLATFORM" --options-json "$RELEASE_OPTIONS_JSON" --output "$RUNNER_TEMP/halo-publish")
          if [ "$PUBLISH_DRY_RUN" = "false" ]; then args+=(--publish --notes-sha256 "$FINAL_NOTES_SHA256"); fi
          python scripts/release/publish.py "${args[@]}"
      - name: Save plan and platform results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo-publish-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/halo-publish/*.json
          if-no-files-found: ignore
