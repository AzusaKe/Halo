plugins {
    id 'net.neoforged.moddev' version '2.0.144'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-neoforge"
}
version = project.mod_version
group = project.maven_group

repositories {
    // Test-only dependencies (JUnit / Gson) resolve from Maven Central.
    mavenCentral()
}

dependencies {
    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:5.9.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.10.1"
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.1 and above require Java 25.
    it.options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}" }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// NeoForge dev environment: 2560x1600 window, non-fullscreen
neoForge {
    version = project.neoforge_version
    validateAccessTransformers = true
    accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]

    mods {
        halo {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            programArgument("--width")
            programArgument("2560")
            programArgument("--height")
            programArgument("1600")
            programArgument("--username")
            programArgument("Dev1")
        }
        // Second client for local multiplayer testing — launch with:
        //   ./gradlew runClient2
        client2 {
            client()
            gameDirectory = file("run2")
            programArgument("--width")
            programArgument("2560")
            programArgument("--height")
            programArgument("1600")
            programArgument("--username")
            programArgument("Dev2")
        }
        // Dedicated server for multiplayer testing - launch with:
        //   ./gradlew runServer
        server {
            server()
            gameDirectory = file("runServer")
            programArgument("--nogui")
        }
    }

    // Give the plain-JUnit test source set access to Minecraft classes.
    addModdingDependenciesTo sourceSets.test
}

// Force fullscreen:false before each runClient launch
tasks.named('runClient') {
    doFirst {
        def optionsFile = file('run/options.txt')
        if (optionsFile.exists()) {
            def lines = optionsFile.readLines()
            def modified = lines.collect { line ->
                line.startsWith('fullscreen:') ? 'fullscreen:false' : line
            }
            optionsFile.text = modified.join('\n') + '\n'
        }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
