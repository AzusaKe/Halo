plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'maven-publish'
}

// JST 2.0.11 fixes anonymous-class access transformers used by NeoForge .88
// (HolderSet$1.contents). Pin the build tool only; runtime/core contracts are unchanged.
neoFormRuntime {
    version = '2.0.31'
}

def coreProperties = new Properties()
file('core/gradle.properties').withInputStream { coreProperties.load(it) }
ext.coreVersion = coreProperties.getProperty('version')
version = "${coreVersion}+adapter.${project.adapter_revision}"
group = project.maven_group

if (providers.gradleProperty('adapterBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('adapterBuildDir').get())
}

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

configurations {
    coreContents { transitive = false }
    runtimeClasspath.extendsFrom localRuntime
}

// NeoForge's module layer must see core and the adapter as one mod in dev,
// matching the flat release jar. A separate library would split shared packages.
def unpackCoreForRun = tasks.register('unpackCoreForRun', Sync) {
    dependsOn configurations.coreContents
    from({ configurations.coreContents.collect { zipTree(it) } }) { exclude 'META-INF/**' }
    into layout.buildDirectory.dir('dev-core')
}
sourceSets {
    coreRuntime {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        output.dir(unpackCoreForRun)
    }
}

dependencies {
    implementation "network.azusake:halo-core:${coreVersion}"
    coreContents "network.azusake:halo-core:${coreVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'

}

neoForge {
    version = project.neo_version

    validateAccessTransformers = true
    accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]

    mods {
        halo {
            sourceSet sourceSets.main
            sourceSet sourceSets.coreRuntime
        }
    }

    runs {
        client {
            client()
            gameDirectory = file("runClient/${project.neo_version}")
            programArguments.addAll '--width', '2560', '--height', '1600', '--username', 'Dev1'
            if (project.hasProperty('smokeWorldName')) programArguments.addAll '--quickPlaySingleplayer', project.property('smokeWorldName')
        }
        client2 {
            client()
            gameDirectory = file("runClient2/${project.neo_version}")
            programArguments.addAll '--width', '2560', '--height', '1600', '--username', 'Dev2'
        }
        server {
            server()
            gameDirectory = file("runServer/${project.minecraft_version}-neoforge-${project.neo_version}")
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    addModdingDependenciesTo sourceSets.test
}

def replaceProperties = [
    minecraft_version      : project.minecraft_version,
    minecraft_version_range: project.minecraft_version_range,
    neo_version            : project.neo_version,
    neo_version_range      : project.neo_version_range,
    loader_version_range   : project.loader_version_range,
    mod_id                 : project.mod_id,
    mod_name               : project.mod_name,
    mod_license            : project.mod_license,
    mod_version            : providers.provider { project.version.toString() },
    mod_authors            : project.mod_authors,
    mod_description        : project.mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties.collectEntries { key, value -> [(key): value instanceof Provider ? value.get() : value] }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jar', Jar).configure {
    dependsOn configurations.coreContents
    from({ configurations.coreContents.collect { zipTree(it) } }) { exclude 'META-INF/MANIFEST.MF' }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('check') { dependsOn gradle.includedBuild('core').task(':check') }
tasks.named('runServer') { standardInput = System.in }
apply from: 'gradle/core-build.gradle'
