plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

def ysmDevJarPath = System.getenv('HALO_YSM_DEV_JAR')
def ysmDevFixtureEnabled = ysmDevJarPath != null && !ysmDevJarPath.isBlank()

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Optional official YSM release used only for development launch testing.
    // It is absent from normal builds and is never bundled in Halo.
    if (ysmDevFixtureEnabled) {
        localRuntime files(ysmDevJarPath)
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    mods {
        halo {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            programArguments.addAll '--width', '2560', '--height', '1600', '--username', 'Dev1'
        }
        client2 {
            client()
            gameDirectory = file('run2')
            programArguments.addAll '--width', '2560', '--height', '1600', '--username', 'Dev2'
        }
        server {
            server()
            gameDirectory = file('runServer')
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    addModdingDependenciesTo sourceSets.test
}

def replaceProperties = [
    minecraft_version      : project.minecraft_version,
    minecraft_version_range: project.minecraft_version_range,
    neo_version            : project.neo_version,
    neo_version_range      : project.neo_version_range,
    loader_version_range   : project.loader_version_range,
    mod_id                 : project.mod_id,
    mod_name               : project.mod_name,
    mod_license            : project.mod_license,
    mod_version            : project.mod_version,
    mod_authors            : project.mod_authors,
    mod_description        : project.mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('runClient').configure {
    doFirst {
        def optionsFile = file('run/options.txt')
        if (optionsFile.exists()) {
            optionsFile.text = optionsFile.readLines().collect {
                it.startsWith('fullscreen:') ? 'fullscreen:false' : it
            }.join('\n') + '\n'
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
